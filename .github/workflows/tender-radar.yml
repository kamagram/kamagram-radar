name: Tender Radar Daily Scan

on:
  schedule:
    # Run at 7 AM UTC every Monday
    - cron: '0 7 * * 1'
  workflow_dispatch:  # Allows manual trigger

# Needed to commit the tender database back to the repo
permissions:
  contents: write

# Never let two runs push the database at the same time
concurrency:
  group: tender-radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      # Tracked copy of the database, so already-sent tenders are remembered between runs
      TENDERS_DB: data/tenders.db

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Tender Radar
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDGRID_TEMPLATE_ID: ${{ secrets.SENDGRID_TEMPLATE_ID }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: |
          mkdir -p data
          python radar.py

      - name: Save tender database
        if: always()
        run: |
          [ -f "$TENDERS_DB" ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TENDERS_DB"
          git diff --cached --quiet || git commit -m "Update tender database [skip ci]"
          git push
